[project]
name = "kb-manage-backend"
version = "0.1.0"
description = "知识库管理平台后端分层服务"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.7.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.3.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiomysql>=0.2.0",
  "cryptography>=43.0.0",
  "redis>=5.2.0",
  "minio>=7.2.0",
  "pymilvus>=2.5.7",
  "alembic>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3.0.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
