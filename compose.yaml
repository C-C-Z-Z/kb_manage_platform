name: kb-manage-platform

services:
  mysql:
    image: mysql:8.0.40
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kb_manage}
      MYSQL_USER: ${MYSQL_USER:-kb_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing local/"$${MINIO_BUCKET_NAME}" &&
        mc anonymous set none local/"$${MINIO_BUCKET_NAME}"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-knowledge-base}
    restart: "no"

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  attu:
    image: zilliz/attu:v2.5.0
    environment:
      MILVUS_URL: http://milvus:19530
    ports:
      - "8088:3000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  db-init:
    image: mysql:8.0.40
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for f in /migrations/*.sql; do
          echo "Applying $$f";
          mysql --default-character-set=utf8mb4 -hmysql -uroot "$MYSQL_DATABASE" < "$$f" || exit 1;
        done
    restart: "no"

  seed:
    image: kb-manage-platform-app:latest
    build:
      context: .
      dockerfile: Dockerfile.app
    env_file:
      - path: backend/.env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kb_manage}
      MYSQL_USER: ${MYSQL_USER:-kb_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["python", "-m", "kb_manage_platform.bootstrap.seed"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  backend:
    image: kb-manage-platform-app:latest
    build:
      context: .
      dockerfile: Dockerfile.app
    env_file:
      - path: backend/.env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      BGE_M3_PATH: /models/bge-m3
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MILVUS_URL: http://milvus:19530
    ports:
      - "8000:8000"
      - "8080:8000"
    volumes:
      - "D:/ai_models/modelscope_cache/models/BAAI/bge-m3:/models/bge-m3:ro"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    image: kb-manage-platform-app:latest
    build:
      context: .
      dockerfile: Dockerfile.app
    env_file:
      - path: backend/.env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MILVUS_URL: http://milvus:19530
      BGE_M3_PATH: /models/bge-m3
    volumes:
      - "D:/ai_models/modelscope_cache/models/BAAI/bge-m3:/models/bge-m3:ro"
    command: ["python", "-m", "kb_manage_platform.workers.main"]
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:


